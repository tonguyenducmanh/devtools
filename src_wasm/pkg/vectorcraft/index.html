<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>VectorCraft</title>
  
<script type="module">
import init, * as bindings from './vectorcraft-web-5d826806b8cf3058.js';
// The .wasm is stored gzip-compressed (.gz) to stay under Cloudflare's
// 25 MiB per-file limit; decompress it in the browser before loading.
if (typeof DecompressionStream === 'undefined') {
  throw new Error('VectorCraft needs a browser with DecompressionStream support (Chrome 80+, Safari 16.4+, Firefox 113+)');
}
const gzResp = await fetch('./vectorcraft-web-5d826806b8cf3058_bg.wasm.gz');
if (!gzResp.ok) throw new Error('Fetching the wasm failed: ' + gzResp.status + ' ' + gzResp.statusText);
const wasmBytes = await new Response(gzResp.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
const wasm = await init({ module_or_path: wasmBytes });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #262626; }
    #vectorcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #vectorcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
<link rel="modulepreload" href="./vectorcraft-web-5d826806b8cf3058.js" crossorigin="anonymous" integrity="sha384-vuYoLiMBwPccoVuoMDQNg44g3ZCpxLDb8oa/K2ipPHXGGGt40YsqvsA30FSd9JT0"></head>
<body>
  <canvas id="vectorcraft_canvas"></canvas>
  <div id="vectorcraft_loading">Loading VectorCraft&hellip;</div>
</body>
</html>
