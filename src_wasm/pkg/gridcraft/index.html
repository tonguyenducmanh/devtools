<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>GridCraft</title>
  
<script type="module">
import init, * as bindings from './gridcraft-web-2fe16bcd4a575b0.js';
// The .wasm is stored gzip-compressed (.gz) to stay under Cloudflare's
// 25 MiB per-file limit; decompress it in the browser before loading.
if (typeof DecompressionStream === 'undefined') {
  throw new Error('GridCraft needs a browser with DecompressionStream support (Chrome 80+, Safari 16.4+, Firefox 113+)');
}
const gzResp = await fetch('./gridcraft-web-2fe16bcd4a575b0_bg.wasm.gz');
if (!gzResp.ok) throw new Error('Fetching the wasm failed: ' + gzResp.status + ' ' + gzResp.statusText);
const wasmBytes = await new Response(gzResp.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
const wasm = await init({ module_or_path: wasmBytes });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f3f3f3; }
    #gridcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #gridcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #555; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
<link rel="modulepreload" href="./gridcraft-web-2fe16bcd4a575b0.js" crossorigin="anonymous" integrity="sha384-lPmHHDmOTAhmEtJeP62CR84L4oHTZf8V9vu2wS4EjoY4OiU4odM72Zclu0ughOV9"></head>
<body>
  <canvas id="gridcraft_canvas"></canvas>
  <div id="gridcraft_loading">Loading GridCraft&hellip;</div>
</body>
</html>
