<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>WordCraft</title>
  
<script type="module">
import init, * as bindings from './wordcraft-web-a8ef9d4369f0536d.js';
// The .wasm is stored gzip-compressed (.gz) to stay under Cloudflare's
// 25 MiB per-file limit; decompress it in the browser before loading.
if (typeof DecompressionStream === 'undefined') {
  throw new Error('WordCraft needs a browser with DecompressionStream support (Chrome 80+, Safari 16.4+, Firefox 113+)');
}
const gzResp = await fetch('./wordcraft-web-a8ef9d4369f0536d_bg.wasm.gz');
if (!gzResp.ok) throw new Error('Fetching the wasm failed: ' + gzResp.status + ' ' + gzResp.statusText);
const wasmBytes = await new Response(gzResp.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
const wasm = await init({ module_or_path: wasmBytes });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #e6e6e6; }
    #wordcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #wordcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #555; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
<link rel="modulepreload" href="./wordcraft-web-a8ef9d4369f0536d.js" crossorigin="anonymous" integrity="sha384-lxQVKUBDTr+77UvK9Hzpv4Q4VulSaxcKGGFLiz9rYCgww/xoaOVVPOprWi4cBG/I"></head>
<body>
  <canvas id="wordcraft_canvas"></canvas>
  <div id="wordcraft_loading">Loading WordCraft&hellip;</div>
</body>
</html>
